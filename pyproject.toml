[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-backlog-kit"
version = "0.1.0"
description = "Deterministic GitHub Issues and Projects backlog workflows for agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aegolius Labs" }]
dependencies = []

[project.scripts]
abk = "agentic_backlog_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
