name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-version:
    name: Compute next semantic version
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: aegolius-labs/.github/.github/workflows/conventional-release.yml@v0.1.1
    with:
      tag-prefix: "v"
      release-branches: "main"
      default-bump: "false"
      update-major-tag: false
      dry-run: true

  preflight:
    name: Validate release candidate
    needs: compute-version
    if: ${{ needs.compute-version.outputs.new-tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.compute-version.outputs.new-tag }}
      RELEASE_VERSION: ${{ needs.compute-version.outputs.new-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate computed version contract
        shell: bash
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Validate tag, metadata, and release assets
        run: python scripts/release_check.py --tag "$RELEASE_TAG" --dist dist
      - name: Verify source-available licensing files
        shell: bash
        run: |
          test -f LICENSE.md
          test -f COMMERCIAL.md
      - name: Preserve validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ needs.compute-version.outputs.new-tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create semantic release
    needs: [compute-version, preflight]
    if: ${{ needs.compute-version.outputs.new-tag != '' && needs.preflight.result == 'success' }}
    permissions:
      contents: write
    uses: aegolius-labs/.github/.github/workflows/conventional-release.yml@v0.1.1
    with:
      tag-prefix: "v"
      release-branches: "main"
      default-bump: "false"
      update-major-tag: false
      dry-run: false

  publish-assets:
    name: Attach and verify distributions
    needs: [compute-version, preflight, release]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.new-tag }}
      COMPUTED_TAG: ${{ needs.compute-version.outputs.new-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.new-tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.compute-version.outputs.new-tag }}
          path: dist
      - name: Verify release identity and distributions
        shell: bash
        run: |
          test "$RELEASE_TAG" = "$COMPUTED_TAG"
          python scripts/release_check.py --tag "$RELEASE_TAG" --dist dist
      - name: Attach distributions to GitHub release
        run: gh release upload "$RELEASE_TAG" dist/*
      - name: Verify published distributions
        shell: bash
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --dir published
          python scripts/release_check.py --tag "$RELEASE_TAG" --dist published
