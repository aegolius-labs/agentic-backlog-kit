name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-version:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: aegolius-labs/.github/.github/workflows/compute-release.yml@194c01743a7a41d75c41e1434d8ca02b3702a586

  preflight:
    needs: compute-version
    if: ${{ needs.compute-version.outputs.new-tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      inventory-sha256: ${{ steps.inventory.outputs.inventory-sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.compute-version.outputs.candidate-sha }}
      RELEASE_TAG: ${{ needs.compute-version.outputs.new-tag }}
      RELEASE_VERSION: ${{ needs.compute-version.outputs.new-version }}
      TAG_STATE_SHA256: ${{ needs.compute-version.outputs.tag-state-sha256 }}
      RELEASE_NOTES: ${{ needs.compute-version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compute-version.outputs.candidate-sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candidate identity and version
        shell: bash
        run: |
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
      - name: Validate release candidate tests and budgets
        env:
          PYTHONPATH: src
        run: |
          python -B -m unittest discover -s tests -v
          python -B scripts/backlog.py --help
          python -B scripts/benchmark.py --check
      - name: Build and validate distributions
        run: |
          python -m pip install build
          python -m build
          python scripts/release_check.py --tag "$RELEASE_TAG" --dist dist
          python -m pip install --force-reinstall dist/*.whl
          abk --help
      - name: Bind the exact validated distributions
        id: inventory
        run: python scripts/release_inventory.py
      - name: Preserve the exact bundle for publication and recovery
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [compute-version, preflight]
    if: ${{ needs.compute-version.outputs.new-tag != '' && needs.preflight.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: aegolius-labs/.github/.github/workflows/publish-release-assets.yml@194c01743a7a41d75c41e1434d8ca02b3702a586
    with:
      automation-sha: 194c01743a7a41d75c41e1434d8ca02b3702a586
      candidate-sha: ${{ needs.compute-version.outputs.candidate-sha }}
      tag: ${{ needs.compute-version.outputs.new-tag }}
      artifact-id: ${{ needs.preflight.outputs.artifact-id }}
      inventory-sha256: ${{ needs.preflight.outputs.inventory-sha256 }}
